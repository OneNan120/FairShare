apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare
  labels:
    app: fairshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fairshare
  template:
    metadata:
      labels:
        app: fairshare
    spec:
      containers:
        - name: fairshare
          image: us-west1-docker.pkg.dev/gen-lang-client-0783211563/fairshare/fairshare:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: fairshare-secrets
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
